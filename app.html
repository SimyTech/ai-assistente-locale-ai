<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07142f">
<title>Maviri</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07142f;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#gate{position:fixed;inset:0;display:grid;place-items:center;color:#dfe7ff;font-size:14px;background:#07142f;z-index:5}
.context{height:48px;display:none;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08);background:#091a39;color:#f6f8ff}.context-brand{display:flex;align-items:center;gap:9px;min-width:0}.context-logo{width:30px;height:30px;border-radius:9px;object-fit:cover;display:block}.context strong{font-size:14px}.context span{font-size:11px;color:#9eafd0;margin-left:8px}.context-actions{display:flex;align-items:center;gap:12px;white-space:nowrap}.context a{color:#9fcfff;text-decoration:none;font-size:12px;touch-action:manipulation}.context a:hover{text-decoration:underline}.context a.verify{color:#ffd07c}.hidden{display:none!important}
#appFrame{width:100%;height:100%;border:0;display:none;background:#07142f;pointer-events:auto;touch-action:auto}
.ready #appFrame{height:calc(100% - 48px)}
@media(max-width:650px){.context span{display:none}.context{padding:0 12px}.context-actions{gap:9px}.context a{font-size:11px}}
</style>
</head>
<body>
<div id="gate">Apertura del tuo spazio Maviri…</div>

<iframe id="appFrame" title="Maviri"></iframe>
<script type="module">
import { adaptiveDashboardPlan } from "/lib/adaptive-ui.js";

const AUTH_KEY="MAVIRI_OWNER_AUTHENTICATED";
const TENANT_KEY="MAVIRI_TENANT_ID";
const ACCOUNT_KEY="MAVIRI_OWNER_ACCOUNT";
const LEGACY_TOKEN_KEY="MAVIRI_OWNER_SYNC_TOKEN";
const DATA_TENANT_KEY="MAVIRI_LOCAL_DATA_TENANT";
const LEGACY_DATA_KEYS=["maviri_app_data_v7","maviri_app_data_v6","maviri_app_data_v5","maviri_app_data_v4","appData","appData_backup"];
const gate=document.getElementById("gate");
const frame=document.getElementById("appFrame");
const context=document.getElementById("context");
const verifyEmailLink=document.getElementById("verifyEmailLink");
let profile=null;
let plan=null;
let adaptiveObserver=null;
let adaptiveScheduled=false;
let adaptiveRunning=false;

function tenant(){return(localStorage.getItem(TENANT_KEY)||"").trim()}
function clearLocalAuth(){localStorage.removeItem(AUTH_KEY);localStorage.removeItem(ACCOUNT_KEY);localStorage.removeItem(LEGACY_TOKEN_KEY)}
function guardTenantCache(){
  const current=tenant();
  if(!current)return;
  const previous=(localStorage.getItem(DATA_TENANT_KEY)||"").trim();
  const hasLegacyData=LEGACY_DATA_KEYS.some(key=>localStorage.getItem(key)!==null);
  const tenantChanged=Boolean(previous&&previous!==current);
  const unownedCache=Boolean(!previous&&current!=="default"&&hasLegacyData);
  if(tenantChanged||unownedCache)LEGACY_DATA_KEYS.forEach(key=>localStorage.removeItem(key));
  localStorage.setItem(DATA_TENANT_KEY,current);
}

async function api(path){
  const t=tenant();
  if(!t)return null;
  try{
    const r=await fetch(path,{method:"GET",headers:{"x-maviri-tenant":t},credentials:"same-origin",cache:"no-store"});
    const j=await r.json().catch(()=>({}));
    return r.ok?j:null;
  }catch{return null}
}
async function verify(){return await api("/api/auth")}
async function loadProfile(){
  const j=await api("/api/activity-profile");
  if(!j)return null;
  if(!j.configured){location.replace("/setup");return null}
  return j.profile||null;
}
function syncAccountFromAuth(auth){
  const account=auth&&auth.account&&typeof auth.account==="object"?auth.account:null;
  if(!account)return;
  localStorage.setItem(ACCOUNT_KEY,JSON.stringify(account));
  verifyEmailLink.classList.toggle("hidden",account.emailVerified===true);
}

function installApiBridge(){
  try{
    const win=frame.contentWindow;
    if(!win||win.__MAVIRI_API_BRIDGE__)return;
    const originalFetch=win.fetch.bind(win);
    win.__MAVIRI_API_BRIDGE__=true;
    win.fetch=async function(input,init={}){
      const rawUrl=typeof input==="string"?input:(input&&input.url)||"";
      let pathname="";
      try{pathname=new URL(rawUrl,win.location.href).pathname}catch{}
      if(!pathname.startsWith("/api/"))return originalFetch(input,init);
      const t=tenant();
      const headers=new Headers(init.headers||(typeof input!=="string"&&input&&input.headers)||{});
      if(t)headers.set("x-maviri-tenant",t);
      let body=init.body;
      if(pathname==="/api/chat"&&typeof body==="string"){
        try{
          const payload=JSON.parse(body);
          if(payload&&typeof payload==="object"&&!Array.isArray(payload)){
            if(t&&!payload.tenantId)payload.tenantId=t;
            if(profile&&!payload.activityProfile)payload.activityProfile=profile;
            body=JSON.stringify(payload);
          }
        }catch{}
      }
      return originalFetch(input,{...init,headers,body,credentials:init.credentials||"same-origin"});
    };
  }catch{}
}

function setButtonLabel(button,label){
  if(!button||!label)return;
  const icon=button.querySelector(".ni");
  const currentText=(button.textContent||"").trim();
  if(currentText===label)return;
  const iconHtml=icon?icon.outerHTML:"";
  button.innerHTML=iconHtml+label;
}
function setDisplay(el,value){if(el&&el.style.display!==value)el.style.display=value}
function reorderNavigation(doc){
  const nav=doc.querySelector("nav.nav");
  if(!nav||!plan)return;
  const buttons=[...nav.querySelectorAll("button[data-page]")];
  const map=new Map(buttons.map(btn=>[btn.dataset.page,btn]));
  const desired=[...plan.order.filter(page=>map.has(page)),...buttons.map(b=>b.dataset.page).filter(page=>!plan.order.includes(page))];
  const current=buttons.map(b=>b.dataset.page);
  if(desired.join("|")!==current.join("|"))desired.forEach(page=>{const btn=map.get(page);if(btn)nav.appendChild(btn)});
  map.forEach((btn,page)=>setDisplay(btn,plan.visible[page]===false?"none":""));
}
function adaptLabels(doc){
  if(!plan)return;
  setButtonLabel(doc.querySelector('button[data-page="calendar"]'),plan.labels.appointments);
  setButtonLabel(doc.querySelector('button[data-page="clients"]'),plan.labels.clients);
  const calendar=doc.getElementById("calendar");
  setDisplay(calendar,plan.visible.calendar?"":"none");
  const newAppointment=doc.querySelector('#calendar button[onclick*="newAp"]');
  const appointmentLabel=`＋ ${plan.labels.appointment}`;
  if(newAppointment&&(newAppointment.textContent||"").trim()!==appointmentLabel)newAppointment.textContent=appointmentLabel;
  const dayTitle=doc.getElementById("dayTitle");
  if(dayTitle&&/appuntament|prenotazion/i.test(dayTitle.textContent||"")&&(dayTitle.textContent||"").trim()!==plan.labels.appointments)dayTitle.textContent=plan.labels.appointments;
  [...doc.querySelectorAll("h1,h2,h3,h4,label,strong")].forEach(el=>{
    const text=(el.textContent||"").trim();
    let next=null;
    if(text==="Clienti")next=plan.labels.clients;
    else if(text==="Cliente")next=plan.labels.client;
    else if(text==="Servizi")next=plan.labels.services;
    else if(text==="Servizio")next=plan.labels.service;
    else if(text==="Appuntamenti")next=plan.labels.appointments;
    else if(text==="Appuntamento")next=plan.labels.appointment;
    if(next&&next!==text)el.textContent=next;
  });
}
function adaptCapabilities(doc){
  if(!plan)return;
  const pageButton=page=>doc.querySelector(`button[data-page="${page}"]`);
  setDisplay(pageButton("calendar"),plan.visible.calendar?"":"none");
  setDisplay(pageButton("clients"),plan.visible.clients?"":"none");
  setDisplay(pageButton("content"),plan.visible.content?"":"none");
  if(!plan.visible.services||!plan.visible.promotions){
    [...doc.querySelectorAll("h2,h3,h4")].forEach(heading=>{
      const text=(heading.textContent||"").trim().toLowerCase();
      if(!plan.visible.services&&text===plan.labels.services.toLowerCase())setDisplay(heading.closest(".card"),"none");
      if(!plan.visible.promotions&&text==="promozioni")setDisplay(heading.closest(".card"),"none");
    });
  }
}
function sanitizeLegacyUi(doc){
  try{
    const token=doc.getElementById("ownerSyncToken");
    if(!token)return;
    const field=token.closest(".field");
    setDisplay(field,"none");
    const row=field&&field.nextElementSibling;
    if(row&&row.classList.contains("row")){
      [...row.querySelectorAll("button")].forEach(btn=>{if((btn.textContent||"").trim().toLowerCase()==="accedi")setDisplay(btn,"none")});
    }
  }catch{}
}
function wireLogout(){
  try{
    const win=frame.contentWindow;
    if(win.__MAVIRI_LOGOUT_WRAPPED__)return;
    const original=win.logoutOwner;
    if(typeof original!=="function")return;
    win.__MAVIRI_LOGOUT_WRAPPED__=true;
    win.logoutOwner=async function(){
      try{await original.apply(this,arguments)}finally{clearLocalAuth();location.replace("/")}
    };
  }catch{}
}
function applyAdaptiveUi(){
  if(adaptiveRunning)return;
  const doc=frame.contentDocument;
  if(!doc||!plan)return;
  adaptiveRunning=true;
  try{
    if(adaptiveObserver)adaptiveObserver.disconnect();
    sanitizeLegacyUi(doc);
    reorderNavigation(doc);
    adaptLabels(doc);
    adaptCapabilities(doc);
    wireLogout();
  }finally{
    adaptiveRunning=false;
    if(adaptiveObserver&&doc.body)adaptiveObserver.observe(doc.body,{subtree:true,childList:true});
  }
}
function scheduleAdaptiveUi(){
  if(adaptiveScheduled)return;
  adaptiveScheduled=true;
  requestAnimationFrame(()=>{
    adaptiveScheduled=false;
    applyAdaptiveUi();
  });
}
frame.addEventListener("load",()=>{
  installApiBridge();
  applyAdaptiveUi();
  const doc=frame.contentDocument;
  adaptiveObserver=new MutationObserver(mutations=>{
    if(mutations.some(m=>m.addedNodes&&m.addedNodes.length))scheduleAdaptiveUi();
  });
  if(doc&&doc.body)adaptiveObserver.observe(doc.body,{subtree:true,childList:true});
  frame.style.display="block";
  context.style.display="flex";
  document.body.classList.add("ready");
  gate.style.display="none";
});
(async()=>{
  const auth=await verify();
  if(!auth||auth.authenticated!==true){clearLocalAuth();location.replace("/login?switch=1&reason=session-required");return}
  localStorage.setItem(AUTH_KEY,"true");
  syncAccountFromAuth(auth);
  guardTenantCache();
  profile=await loadProfile();
  if(!profile)return;
  plan=adaptiveDashboardPlan(profile);
  document.getElementById("activityName").textContent="Maviri";
  document.getElementById("activitySummary").textContent=plan.name?"Spazio di "+plan.name:plan.summary;
  frame.src="/index.html";
})();
</script>
</body>
</html>
