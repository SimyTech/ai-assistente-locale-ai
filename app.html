<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07142f">
<title>Maviri</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07142f;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#gate{position:fixed;inset:0;display:grid;place-items:center;color:#dfe7ff;font-size:14px;background:#07142f;z-index:5}
.context{height:48px;display:none;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08);background:#091a39;color:#f6f8ff}
.context strong{font-size:13px}.context span{font-size:11px;color:#9eafd0;margin-left:8px}.context-actions{display:flex;align-items:center;gap:12px;white-space:nowrap}.context a{color:#9fcfff;text-decoration:none;font-size:12px;touch-action:manipulation}.context a:hover{text-decoration:underline}.context a.verify{color:#ffd07c}.hidden{display:none!important}
#appFrame{width:100%;height:100%;border:0;display:none;background:#07142f;pointer-events:auto;touch-action:auto}
.ready #appFrame{height:calc(100% - 48px)}
@media(max-width:650px){.context span{display:none}.context{padding:0 12px}.context-actions{gap:9px}.context a{font-size:11px}}
</style>
</head>
<body>
<div id="gate">Apertura del tuo spazio Maviri…</div>
<div id="context" class="context"><div><strong id="activityName">Maviri</strong><span id="activitySummary"></span></div><div class="context-actions"><a id="verifyEmailLink" class="verify hidden" href="/account">Verifica email</a><a href="/account" aria-label="Gestisci account">Account</a><a href="/setup">Configura attività</a></div></div>
<iframe id="appFrame" title="Maviri"></iframe>
<script src="/recovery-metrics.js"></script>
<script type="module">
import { adaptiveDashboardPlan } from "/lib/adaptive-ui.js";

const AUTH_KEY="MAVIRI_OWNER_AUTHENTICATED";
const TENANT_KEY="MAVIRI_TENANT_ID";
const ACCOUNT_KEY="MAVIRI_OWNER_ACCOUNT";
const LEGACY_TOKEN_KEY="MAVIRI_OWNER_SYNC_TOKEN";
const DATA_TENANT_KEY="MAVIRI_LOCAL_DATA_TENANT";
const LEGACY_DATA_KEYS=["maviri_app_data_v7","maviri_app_data_v6","maviri_app_data_v5","maviri_app_data_v4","appData","appData_backup"];
const gate=document.getElementById("gate");
const frame=document.getElementById("appFrame");
const context=document.getElementById("context");
const verifyEmailLink=document.getElementById("verifyEmailLink");
let profile=null;
let plan=null;
let adaptiveObserver=null;
let adaptiveScheduled=false;
let adaptiveRunning=false;
let operationalTimer=null;
let operationalRunning=false;
const operationalActions=new Map();

function tenant(){return(localStorage.getItem(TENANT_KEY)||"").trim()}
function clearLocalAuth(){localStorage.removeItem(AUTH_KEY);localStorage.removeItem(ACCOUNT_KEY);localStorage.removeItem(LEGACY_TOKEN_KEY)}
function guardTenantCache(){
  const current=tenant();
  if(!current)return;
  const previous=(localStorage.getItem(DATA_TENANT_KEY)||"").trim();
  const hasLegacyData=LEGACY_DATA_KEYS.some(key=>localStorage.getItem(key)!==null);
  const tenantChanged=Boolean(previous&&previous!==current);
  const unownedCache=Boolean(!previous&&current!=="default"&&hasLegacyData);
  if(tenantChanged||unownedCache)LEGACY_DATA_KEYS.forEach(key=>localStorage.removeItem(key));
  localStorage.setItem(DATA_TENANT_KEY,current);
}

async function api(path){
  const t=tenant();
  if(!t)return null;
  try{
    const r=await fetch(path,{method:"GET",headers:{"x-maviri-tenant":t},credentials:"same-origin",cache:"no-store"});
    const j=await r.json().catch(()=>({}));
    return r.ok?j:null;
  }catch{return null}
}
async function verify(){return await api("/api/auth")}
async function loadProfile(){
  const j=await api("/api/activity-profile");
  if(!j)return null;
  if(!j.configured){location.replace("/setup");return null}
  return j.profile||null;
}
function syncAccountFromAuth(auth){
  const account=auth&&auth.account&&typeof auth.account==="object"?auth.account:null;
  if(!account)return;
  localStorage.setItem(ACCOUNT_KEY,JSON.stringify(account));
  verifyEmailLink.classList.toggle("hidden",account.emailVerified===true);
}

function installApiBridge(){
  try{
    const win=frame.contentWindow;
    if(!win||win.__MAVIRI_API_BRIDGE__)return;
    const originalFetch=win.fetch.bind(win);
    win.__MAVIRI_API_BRIDGE__=true;
    win.fetch=async function(input,init={}){
      const rawUrl=typeof input==="string"?input:(input&&input.url)||"";
      let pathname="";
      try{pathname=new URL(rawUrl,win.location.href).pathname}catch{}
      if(!pathname.startsWith("/api/"))return originalFetch(input,init);
      const t=tenant();
      const headers=new Headers(init.headers||(typeof input!=="string"&&input&&input.headers)||{});
      if(t)headers.set("x-maviri-tenant",t);
      let body=init.body;
      if(pathname==="/api/chat"&&typeof body==="string"){
        try{
          const payload=JSON.parse(body);
          if(payload&&typeof payload==="object"&&!Array.isArray(payload)){
            if(t&&!payload.tenantId)payload.tenantId=t;
            if(profile&&!payload.activityProfile)payload.activityProfile=profile;
            body=JSON.stringify(payload);
          }
        }catch{}
      }
      return originalFetch(input,{...init,headers,body,credentials:init.credentials||"same-origin"});
    };
  }catch{}
}

function readLocalData(){
  for(const key of LEGACY_DATA_KEYS){
    const raw=localStorage.getItem(key);
    if(!raw)continue;
    try{const value=JSON.parse(raw);if(value&&typeof value==="object")return value}catch{}
  }
  return {};
}
function renderAttributedRecoveryMetrics(){
  const doc=frame.contentDocument;
  const source=readLocalData();
  if(!doc||!source||typeof window.maviriRecoveryMetrics!=="function")return;
  const result=window.maviriRecoveryMetrics(source.clients,source.appointments);
  const contacts=doc.getElementById("sRecoveryContacts");
  const conversion=doc.getElementById("sRecoveryConversion");
  if(contacts)contacts.textContent=String(result.contacts);
  if(conversion){
    conversion.textContent=`${result.conversionRate}%`;
    conversion.title=`${result.conversions} clienti hanno prenotato dopo il richiamo`;
  }
}
function wireAttributedRecoveryMetrics(){
  const win=frame.contentWindow;
  if(!win||win.__MAVIRI_RECOVERY_METRICS_WRAPPED__)return;
  const original=win.renderAll;
  if(typeof original!=="function")return;
  win.__MAVIRI_RECOVERY_METRICS_WRAPPED__=true;
  win.renderAll=function(){
    const result=original.apply(this,arguments);
    renderAttributedRecoveryMetrics();
    return result;
  };
  renderAttributedRecoveryMetrics();
}
function normalizeOperationalHours(data){
  const source=data?.settings?.hours;
  if(!Array.isArray(source))return source||data?.hours||{};
  const keys=["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
  return Object.fromEntries(keys.map((key,index)=>{
    const row=source[index]||{};
    return [key,{closed:row.closed===true,start:row.open||row.start,end:row.close||row.end,breaks:Array.isArray(row.pauses)?row.pauses.map(p=>({start:p.start||p.from,end:p.end||p.to})):[]}];
  }));
}
function operationalPayload(){
  const data=readLocalData();
  return {
    action:"chat",
    role:"owner",
    message:"Mostrami il centro operativo",
    tenantId:tenant(),
    activityProfile:profile,
    business:data.business||{},
    services:Array.isArray(data.services)?data.services:[],
    clients:Array.isArray(data.clients)?data.clients:[],
    appointments:Array.isArray(data.appointments)?data.appointments:[],
    hours:normalizeOperationalHours(data)
  };
}
function operationalDetail(item){
  if(item.type==="agenda-gap")return `${item.date||""} · ${item.start||""}–${item.end||""} · ${Number(item.minutes||0)} min liberi`;
  const proposal=item.suggestedGap?` · Proponi ${formatOperationalDate(item.suggestedGap.date)} alle ${item.suggestedGap.start}`:"";
  if(item.type==="inactive-client")return `${item.lastVisit?`Ultima visita ${formatOperationalDate(item.lastVisit)}`:"Cliente inattivo"}${item.service?` · ${item.service}`:""}${proposal}`;
  if(item.type==="cancellation-recovery")return `${item.cancelledDate?`Cancellazione ${formatOperationalDate(item.cancelledDate)}`:"Cancellazione da recuperare"}${item.service?` · ${item.service}`:""}${Number(item.value||0)>0?` · €${Number(item.value).toFixed(2)}`:""}${proposal}`;
  return "Azione suggerita da Mavi";
}
function formatOperationalDate(value){
  const parts=String(value||"").split("-");
  return parts.length===3?`${parts[2]}/${parts[1]}/${parts[0]}`:String(value||"");
}
function operationalActionLabel(item){
  if(item.type==="agenda-gap")return "Apri prenotazione";
  if(item.suggestedGap)return "Proponi questo orario";
  if(item.type==="cancellation-recovery")return "Recupera cliente";
  return "Ricontatta cliente";
}
function findOperationalClient(item){
  const clients=Array.isArray(readLocalData().clients)?readLocalData().clients:[];
  return clients.find(client=>item.clientId&&client.id===item.clientId)||clients.find(client=>(client.name||"").trim().toLowerCase()===(item.name||"").trim().toLowerCase())||null;
}
function whatsappDraft(item,client){
  const businessName=(profile?.name||readLocalData()?.business?.name||"la nostra attività").trim();
  const gap=item.suggestedGap;
  const exactProposal=gap?` Abbiamo uno spazio disponibile il ${formatOperationalDate(gap.date)} alle ${gap.start}${gap.service?` per ${gap.service}`:""}: può andare bene?`:"";
  if(exactProposal)return `Ciao ${client?.name||item.name||""}, ti contattiamo da ${businessName}.${exactProposal}`;
  if(item.type==="cancellation-recovery")return `Ciao ${client?.name||item.name||""}, ti contattiamo da ${businessName}. Vuoi riprogrammare ${item.service?`il tuo appuntamento per ${item.service}`:"il tuo appuntamento"}? Possiamo cercare insieme il momento più comodo.`;
  return `Ciao ${client?.name||item.name||""}, è da un po' che non ci vediamo da ${businessName}. Se vuoi, possiamo trovare un nuovo appuntamento${item.service?` per ${item.service}`:""}.`;
}
function openOperationalBooking(item,client=null,source="operational-gap"){
  const win=frame.contentWindow;
  const doc=frame.contentDocument;
  if(!win||!doc||typeof win.newAp!=="function")return;
  if(typeof win.go==="function")win.go("calendar");
  const service=item.recommendedService?.name||item.service||"";
  win.newAp(client?.id||"",encodeURIComponent(service),source);
  const dateInput=doc.getElementById("ad");
  const timeInput=doc.getElementById("at");
  if(dateInput&&item.date)dateInput.value=item.date;
  if(timeInput&&item.start)timeInput.value=item.start;
}
function executeOperationalAction(item){
  if(!item)return;
  if(item.type==="agenda-gap"){openOperationalBooking(item);return}
  const client=findOperationalClient(item);
  const phone=String(client?.whatsapp||client?.phone||"").replace(/\D/g,"");
  if(phone){window.open(`https://wa.me/${phone}?text=${encodeURIComponent(whatsappDraft(item,client))}`,"_blank","noopener,noreferrer");return}
  const win=frame.contentWindow;
  if(client&&win&&typeof win.openClientFromHome==="function")win.openClientFromHome(client.id);
}
function markOperationalContacted(item){
  const client=findOperationalClient(item);
  const win=frame.contentWindow;
  if(!client||!win||typeof win.markRecoveryContacted!=="function")return;
  win.markRecoveryContacted(client.id);
  setTimeout(refreshOperationalDashboard,0);
}
function bookOperationalProposal(item){
  const client=findOperationalClient(item);
  if(!client||!item?.suggestedGap)return;
  openOperationalBooking({...item.suggestedGap,service:item.suggestedGap.service||item.service},client,"operational-recovery");
}
function wireOperationalActions(list){
  if(list.dataset.actionsReady==="true")return;
  list.dataset.actionsReady="true";
  list.addEventListener("click",event=>{
    const button=event.target.closest("[data-operational-action]");
    if(button)executeOperationalAction(operationalActions.get(button.dataset.operationalAction));
    const completed=event.target.closest("[data-operational-complete]");
    if(completed)markOperationalContacted(operationalActions.get(completed.dataset.operationalComplete));
    const booking=event.target.closest("[data-operational-booking]");
    if(booking)bookOperationalProposal(operationalActions.get(booking.dataset.operationalBooking));
  });
}
function renderOperationalDashboard(center){
  const doc=frame.contentDocument;
  if(!doc||!center)return;
  const list=doc.getElementById("operations");
  const badge=doc.getElementById("operationCount");
  if(!list||!badge)return;
  const summary=center.summary||{};
  badge.textContent=`${Number(summary.totalActions||0)} azioni · €${Number(summary.recoverableValue||0).toFixed(0)} recuperabili`;
  const card=list.closest(".card");
  const subtitle=card?.querySelector(".muted");
  if(subtitle)subtitle.textContent=`${Number(summary.agendaGaps||0)} buchi agenda · ${Number(summary.inactiveClients||0)} clienti inattivi · ${Number(summary.cancellationRecoveries||0)} cancellazioni recuperabili`;
  const actions=Array.isArray(center.actions)?center.actions.slice(0,8):[];
  if(!actions.length){list.innerHTML='<div class="empty">Nessuna opportunità urgente rilevata da Mavi.</div>';return}
  operationalActions.clear();
  list.innerHTML=actions.map((item,index)=>{
    const key=`${center.generatedAt||"center"}-${index}`;
    operationalActions.set(key,item);
    const complete=item.type!=="agenda-gap"?`<button type="button" class="btn small" data-operational-complete="${escapeHtml(key)}">Segna contattato</button>`:"";
    const booking=item.suggestedGap?`<button type="button" class="btn small primary" data-operational-booking="${escapeHtml(key)}">＋ Prenota proposta</button>`:"";
    return `<div class="item"><div class="between"><div><strong>${escapeHtml(item.label||"Azione operativa")}</strong><div class="meta" style="margin-top:5px">${escapeHtml(operationalDetail(item))}</div></div><span class="badge ${item.priority==="high"?"":"blue"}">${item.priority==="high"?"Priorità alta":"Priorità media"}</span></div><div class="row" style="margin-top:10px"><button type="button" class="btn small primary" data-operational-action="${escapeHtml(key)}">${escapeHtml(operationalActionLabel(item))}</button>${booking}${complete}</div></div>`;
  }).join("");
  wireOperationalActions(list);
}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]))}
async function refreshOperationalDashboard(){
  if(operationalRunning||!frame.contentDocument)return;
  operationalRunning=true;
  try{
    const t=tenant();
    if(!t)return;
    const response=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json","x-maviri-tenant":t},credentials:"same-origin",cache:"no-store",body:JSON.stringify(operationalPayload())});
    const result=await response.json().catch(()=>null);
    if(response.ok&&result?.operationalCenter)renderOperationalDashboard(result.operationalCenter);
  }catch{}finally{operationalRunning=false}
}

function setButtonLabel(button,label){
  if(!button||!label)return;
  const icon=button.querySelector(".ni");
  const currentText=(button.textContent||"").trim();
  if(currentText===label)return;
  const iconHtml=icon?icon.outerHTML:"";
  button.innerHTML=iconHtml+label;
}
function setDisplay(el,value){if(el&&el.style.display!==value)el.style.display=value}
function reorderNavigation(doc){
  const nav=doc.querySelector("nav.nav");
  if(!nav||!plan)return;
  const buttons=[...nav.querySelectorAll("button[data-page]")];
  const map=new Map(buttons.map(btn=>[btn.dataset.page,btn]));
  const desired=[...plan.order.filter(page=>map.has(page)),...buttons.map(b=>b.dataset.page).filter(page=>!plan.order.includes(page))];
  const current=buttons.map(b=>b.dataset.page);
  if(desired.join("|")!==current.join("|"))desired.forEach(page=>{const btn=map.get(page);if(btn)nav.appendChild(btn)});
  map.forEach((btn,page)=>setDisplay(btn,plan.visible[page]===false?"none":""));
}
function adaptLabels(doc){
  if(!plan)return;
  setButtonLabel(doc.querySelector('button[data-page="calendar"]'),plan.labels.appointments);
  setButtonLabel(doc.querySelector('button[data-page="clients"]'),plan.labels.clients);
  const calendar=doc.getElementById("calendar");
  setDisplay(calendar,plan.visible.calendar?"":"none");
  const newAppointment=doc.querySelector('#calendar button[onclick*="newAp"]');
  const appointmentLabel=`＋ ${plan.labels.appointment}`;
  if(newAppointment&&(newAppointment.textContent||"").trim()!==appointmentLabel)newAppointment.textContent=appointmentLabel;
  const dayTitle=doc.getElementById("dayTitle");
  if(dayTitle&&/appuntament|prenotazion/i.test(dayTitle.textContent||"")&&(dayTitle.textContent||"").trim()!==plan.labels.appointments)dayTitle.textContent=plan.labels.appointments;
  [...doc.querySelectorAll("h1,h2,h3,h4,label,strong")].forEach(el=>{
    const text=(el.textContent||"").trim();
    let next=null;
    if(text==="Clienti")next=plan.labels.clients;
    else if(text==="Cliente")next=plan.labels.client;
    else if(text==="Servizi")next=plan.labels.services;
    else if(text==="Servizio")next=plan.labels.service;
    else if(text==="Appuntamenti")next=plan.labels.appointments;
    else if(text==="Appuntamento")next=plan.labels.appointment;
    if(next&&next!==text)el.textContent=next;
  });
}
function adaptCapabilities(doc){
  if(!plan)return;
  const pageButton=page=>doc.querySelector(`button[data-page="${page}"]`);
  setDisplay(pageButton("calendar"),plan.visible.calendar?"":"none");
  setDisplay(pageButton("clients"),plan.visible.clients?"":"none");
  setDisplay(pageButton("content"),plan.visible.content?"":"none");
  if(!plan.visible.services||!plan.visible.promotions){
    [...doc.querySelectorAll("h2,h3,h4")].forEach(heading=>{
      const text=(heading.textContent||"").trim().toLowerCase();
      if(!plan.visible.services&&text===plan.labels.services.toLowerCase())setDisplay(heading.closest(".card"),"none");
      if(!plan.visible.promotions&&text==="promozioni")setDisplay(heading.closest(".card"),"none");
    });
  }
}
function sanitizeLegacyUi(doc){
  try{
    const token=doc.getElementById("ownerSyncToken");
    if(!token)return;
    const field=token.closest(".field");
    setDisplay(field,"none");
    const row=field&&field.nextElementSibling;
    if(row&&row.classList.contains("row")){
      [...row.querySelectorAll("button")].forEach(btn=>{if((btn.textContent||"").trim().toLowerCase()==="accedi")setDisplay(btn,"none")});
    }
  }catch{}
}
function wireLogout(){
  try{
    const win=frame.contentWindow;
    if(win.__MAVIRI_LOGOUT_WRAPPED__)return;
    const original=win.logoutOwner;
    if(typeof original!=="function")return;
    win.__MAVIRI_LOGOUT_WRAPPED__=true;
    win.logoutOwner=async function(){
      try{await original.apply(this,arguments)}finally{clearLocalAuth();location.replace("/")}
    };
  }catch{}
}
function applyAdaptiveUi(){
  if(adaptiveRunning)return;
  const doc=frame.contentDocument;
  if(!doc||!plan)return;
  adaptiveRunning=true;
  try{
    if(adaptiveObserver)adaptiveObserver.disconnect();
    sanitizeLegacyUi(doc);
    reorderNavigation(doc);
    adaptLabels(doc);
    adaptCapabilities(doc);
    wireLogout();
  }finally{
    adaptiveRunning=false;
    if(adaptiveObserver&&doc.body)adaptiveObserver.observe(doc.body,{subtree:true,childList:true});
  }
}
function scheduleAdaptiveUi(){
  if(adaptiveScheduled)return;
  adaptiveScheduled=true;
  requestAnimationFrame(()=>{
    adaptiveScheduled=false;
    applyAdaptiveUi();
  });
}
frame.addEventListener("load",()=>{
  installApiBridge();
  wireAttributedRecoveryMetrics();
  applyAdaptiveUi();
  refreshOperationalDashboard();
  clearInterval(operationalTimer);
  operationalTimer=setInterval(refreshOperationalDashboard,60000);
  const doc=frame.contentDocument;
  adaptiveObserver=new MutationObserver(mutations=>{
    if(mutations.some(m=>m.addedNodes&&m.addedNodes.length))scheduleAdaptiveUi();
  });
  if(doc&&doc.body)adaptiveObserver.observe(doc.body,{subtree:true,childList:true});
  frame.style.display="block";
  context.style.display="flex";
  document.body.classList.add("ready");
  gate.style.display="none";
});
(async()=>{
  const auth=await verify();
  if(!auth||auth.authenticated!==true){clearLocalAuth();location.replace("/login?switch=1&reason=session-required");return}
  localStorage.setItem(AUTH_KEY,"true");
  syncAccountFromAuth(auth);
  guardTenantCache();
  profile=await loadProfile();
  if(!profile)return;
  plan=adaptiveDashboardPlan(profile);
  document.getElementById("activityName").textContent=plan.name||"Maviri";
  document.getElementById("activitySummary").textContent=plan.summary;
  frame.src="/index.html";
})();
</script>
</body>
</html>
