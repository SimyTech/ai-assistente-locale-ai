name: Promemoria automatici Maviri

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maviri-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    name: Invia promemoria dovuti
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Richiama il motore promemoria
        env:
          MAVIRI_REMINDER_SECRET: ${{ secrets.MAVIRI_REMINDER_SECRET }}
          MAVIRI_REMINDER_URL: ${{ secrets.MAVIRI_REMINDER_URL }}
        run: |
          set -euo pipefail
          URL="${MAVIRI_REMINDER_URL:-https://ai-assistente-locale-ai.vercel.app/api/reminders}"
          if [ -z "${MAVIRI_REMINDER_SECRET:-}" ]; then
            echo "Secret MAVIRI_REMINDER_SECRET non configurato" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -X POST "$URL" \
            -H "Authorization: Bearer $MAVIRI_REMINDER_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'
