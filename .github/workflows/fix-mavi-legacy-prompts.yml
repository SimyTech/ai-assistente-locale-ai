name: Fix Mavi legacy prompts

on:
  push:
    branches:
      - feat/mavi-screen-account-menu

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mavi-screen-account-menu
      - name: Add required quick prompts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          target='<div class="quick-prompts"><div class="mavi-actions" aria-label="Azioni rapide di Mavi">'
          if target not in s:
              raise SystemExit('quick prompts wrapper not found')
          insert = target + '<button class="prompt-chip" onclick="askMavi(\'Oggi che si fa?\')">✦ Oggi che si fa?</button><button class="prompt-chip" onclick="askMavi(\'In questo mese?\')">◫ In questo mese?</button>'
          s=s.replace(target,insert,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/fix-mavi-legacy-prompts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "UI: ripristina prompt rapidi Mavi"
          git push origin HEAD:feat/mavi-screen-account-menu
