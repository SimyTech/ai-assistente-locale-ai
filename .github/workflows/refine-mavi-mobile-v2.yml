name: Refine Mavi mobile v2
on:
  push:
    branches:
      - fix/mavi-mobile-layout-v2
    paths:
      - .github/workflows/refine-mavi-mobile-v2.yml
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mavi-mobile-layout-v2
      - name: Apply Mavi mobile redesign
        run: python scripts/refine_mavi_v2.py
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "UI: rifinisce schermata Mavi mobile" || exit 0
          git push
