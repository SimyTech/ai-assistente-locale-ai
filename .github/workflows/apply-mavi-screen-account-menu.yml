name: Apply Mavi screen and activity menu

on:
  push:
    branches:
      - feat/mavi-screen-account-menu

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mavi-screen-account-menu
          fetch-depth: 0

      - name: Patch Maviri UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* MAVIRI MAVI HERO + UNIVERSAL ACTIVITY MENU */'
          if marker not in text:
              css = r'''
          /* MAVIRI MAVI HERO + UNIVERSAL ACTIVITY MENU */
          .top{gap:16px}
          .top-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
          .activity-menu{position:relative;z-index:40}
          .activity-menu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid rgba(255,255,255,.11);border-radius:14px;background:rgba(10,28,61,.78);color:#f6f8ff;font-weight:800;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.16);user-select:none}
          .activity-menu summary::-webkit-details-marker{display:none}
          .activity-menu summary::after{content:'⌄';color:#9eafd0;font-size:14px;transition:transform .18s ease}
          .activity-menu[open] summary::after{transform:rotate(180deg)}
          .activity-menu-panel{position:absolute;right:0;top:calc(100% + 8px);width:220px;padding:8px;border:1px solid rgba(255,255,255,.1);border-radius:15px;background:#0b1d40;box-shadow:0 18px 50px rgba(0,0,0,.4)}
          .activity-menu-panel button{width:100%;border:0;background:transparent;color:#eaf0ff;text-align:left;padding:11px 12px;border-radius:10px;font:inherit;font-size:13px;cursor:pointer}
          .activity-menu-panel button:hover{background:rgba(255,255,255,.07)}
          .activity-menu-panel .logout-action{color:#ff9b9b;border-top:1px solid rgba(255,255,255,.08);border-radius:0 0 10px 10px;margin-top:4px;padding-top:12px}
          #mavi .chat{overflow:hidden;padding:0;background:linear-gradient(180deg,rgba(11,29,64,.94),rgba(7,20,47,.98));border-color:rgba(86,129,255,.22)}
          .mavi-stage{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:370px;padding:38px 24px 24px;overflow:hidden;background:radial-gradient(circle at 50% 28%,rgba(85,83,255,.18),transparent 31%),radial-gradient(circle at 80% 45%,rgba(0,219,183,.08),transparent 28%)}
          .mavi-stage::before{content:'';position:absolute;left:-8%;right:-8%;top:47%;height:120px;background:linear-gradient(90deg,transparent,rgba(82,65,255,.28),rgba(33,177,255,.28),rgba(0,223,184,.2),transparent);filter:blur(28px);opacity:.55;transform:skewY(-3deg);pointer-events:none}
          .mavi-model-line{position:absolute;right:18px;top:16px;z-index:2}
          .mavi-orb{position:relative;z-index:1;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;padding:5px;background:linear-gradient(135deg,#38a7ff,#875cff 52%,#39d98a);box-shadow:0 0 34px rgba(56,167,255,.3),0 0 58px rgba(135,92,255,.16)}
          .mavi-orb-inner{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#07142f;box-shadow:inset 0 0 30px rgba(56,167,255,.12)}
          .mavi-hero-logo{width:92px;height:92px;object-fit:cover;border-radius:22px;display:block}
          .mavi-name{position:relative;z-index:1;margin:14px 0 0;font-size:clamp(38px,6vw,58px);line-height:1;font-weight:950;letter-spacing:-2px;background:linear-gradient(110deg,#29c8ff 0%,#3f7cff 22%,#9b4dff 54%,#36e9c1 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px rgba(93,104,255,.16)}
          .mavi-tagline{position:relative;z-index:1;margin:8px 0 0;color:#aebddd;font-size:clamp(15px,2.2vw,19px)}
          .mavi-voice-wrap{position:relative;z-index:1;margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:7px}
          .mavi-voice{width:78px;height:78px;border-radius:50%!important;padding:0!important;font-size:30px!important;display:grid!important;place-items:center;border:2px solid rgba(255,255,255,.18)!important;background:linear-gradient(135deg,#188dff,#6b45ff 58%,#b84cff)!important;box-shadow:0 0 30px rgba(54,112,255,.42);transition:transform .16s ease,box-shadow .16s ease}
          .mavi-voice:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 38px rgba(75,119,255,.55)}
          .mavi-voice:disabled{opacity:.45;filter:grayscale(.4)}
          .mavi-voice-label{font-size:12px;color:#9eafd0}
          .mavi-actions{position:relative;z-index:1;display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:0 22px 22px}
          .mavi-actions .prompt-chip{min-height:44px;padding:10px 14px;border-radius:14px;background:rgba(9,27,60,.8);border:1px solid rgba(89,138,255,.22);color:#e8efff;box-shadow:none}
          .mavi-actions .prompt-chip:hover{border-color:rgba(76,171,255,.5);background:rgba(15,42,88,.9)}
          .mavi-conversation{margin:0 18px 18px;padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:rgba(3,14,35,.54)}
          .mavi-conversation .messages{min-height:160px;max-height:340px}
          .mavi-conversation .chatbar{margin-top:12px}
          .mavi-conversation .chatbar input{min-height:48px;border-radius:14px}
          @media(max-width:760px){.top{align-items:flex-start}.top-actions{max-width:55%}.save-pill{display:none}.activity-menu summary{font-size:12px;padding:0 11px}.mavi-stage{min-height:330px;padding:30px 14px 18px}.mavi-model-line{position:static;order:-1;margin-bottom:16px}.mavi-orb{width:128px;height:128px}.mavi-hero-logo{width:78px;height:78px}.mavi-actions{padding:0 12px 16px}.mavi-actions .prompt-chip{flex:1 1 calc(50% - 9px)}.mavi-conversation{margin:0 10px 10px;padding:12px}}
          @media(max-width:430px){.top-actions{max-width:52%}.activity-menu-panel{width:205px}.mavi-actions .prompt-chip{flex-basis:100%}.mavi-name{font-size:42px}.mavi-conversation .chatbar{display:grid;grid-template-columns:1fr auto}.mavi-conversation .chatbar input{min-width:0}}
          '''
              text = text.replace('</style>', css + '\n</style>', 1)

          top_pattern = re.compile(r'<div class="top"><div><h1 id="title">Home</h1><p id="subtitle">Il tuo manager digitale, sempre con te\.</p></div><span class="muted save-pill" id="saveState">Dati salvati localmente</span></div>')
          top_new = '''<div class="top"><div><h1 id="title">Home</h1><p id="subtitle">Il tuo manager digitale, sempre con te.</p></div><div class="top-actions"><span class="muted save-pill" id="saveState">Dati salvati localmente</span><details class="activity-menu"><summary>La tua attività</summary><div class="activity-menu-panel"><button type="button" onclick="window.top.location.href='/account'">Account</button><button type="button" onclick="go('settings');this.closest('details').removeAttribute('open')">Impostazioni attività</button><button type="button" class="logout-action" onclick="if(confirm('Vuoi uscire da Maviri?')) logoutOwner()">↪ Esci</button></div></details></div></div>'''
          text, count = top_pattern.subn(top_new, text, count=1)
          if count != 1:
              raise SystemExit('Top bar target not found exactly once')

          mavi_pattern = re.compile(r'<section class="page" id="mavi">.*?</section>', re.S)
          mavi_new = '''<section class="page" id="mavi"><div class="card chat"><div class="mavi-stage"><div class="mavi-model-line"><span class="badge" id="maviModelBadge">MAVI FAST CORE</span></div><div class="mavi-orb"><div class="mavi-orb-inner"><img class="mavi-hero-logo" id="maviHeroLogo" alt="Mavi"></div></div><h2 class="mavi-name">Mavi</h2><p class="mavi-tagline">Il tuo assistente intelligente</p><div class="mavi-voice-wrap"><button class="btn mavi-voice" id="voice" aria-label="Parla con Mavi" title="Parla con Mavi">🎙</button><span class="mavi-voice-label">Tocca per parlare</span></div></div><div class="mavi-actions" aria-label="Azioni rapide di Mavi"><button class="prompt-chip" onclick="askMavi('Controlla la disponibilità')">🗓 Controlla la disponibilità</button><button class="prompt-chip" onclick="askMavi('Prenota un appuntamento')">＋ Prenota un appuntamento</button><button class="prompt-chip" onclick="askMavi('Mostra le promozioni')">◆ Mostra le promozioni</button><button class="prompt-chip" onclick="askMavi('Cerca un cliente')">👥 Cerca un cliente</button><button class="prompt-chip" onclick="askMavi('Dimmi gli orari di apertura')">? Orari di apertura</button></div><div class="mavi-conversation"><div class="messages" id="messages"><div class="bubble mavi">Ciao, sono Mavi. Dimmi cosa vuoi fare: posso controllare agenda, clienti, servizi, promozioni e aiutarti a gestire gli appuntamenti.</div></div><div class="chatbar"><input id="maviInput" aria-label="Messaggio per Mavi" placeholder="Scrivi un messaggio a Mavi…" onkeydown="if(event.key==='Enter')sendMavi()"><button class="btn primary" onclick="sendMavi()">Invia</button></div></div></div></section>'''
          text, count = mavi_pattern.subn(mavi_new, text, count=1)
          if count != 1:
              raise SystemExit(f'Mavi section target count: {count}')

          hook = 'function askMavi(message){$("maviInput").value=message;sendMavi()}'
          replacement = '''function syncMaviHeroLogo(){const hero=$("maviHeroLogo"),source=document.querySelector(".logo.big")||document.querySelector("img.logo");if(hero&&source?.src)hero.src=source.src}\nfunction askMavi(message){$("maviInput").value=message;sendMavi()}'''
          if hook not in text:
              raise SystemExit('askMavi hook not found')
          text = text.replace(hook, replacement, 1)

          render_hook = 'renderAll();\ninitOwnerSession();\nrenderMaviModel();'
          render_replacement = 'renderAll();\nsyncMaviHeroLogo();\ninitOwnerSession();\nrenderMaviModel();'
          if render_hook not in text:
              raise SystemExit('render hook not found')
          text = text.replace(render_hook, render_replacement, 1)

          path.write_text(text, encoding='utf-8')

      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/apply-mavi-screen-account-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "UI: nuova schermata Mavi e menu attività universale"
          git push origin HEAD:feat/mavi-screen-account-menu
