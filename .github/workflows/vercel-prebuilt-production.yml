name: Deploy Maviri prebuilt to Production

on:
  push:
    branches: ["vercel-prebuilt-production"]

permissions:
  contents: read

concurrency:
  group: maviri-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build GitHub e deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_2dQimqvvbvp6oQwdbpHCPaHu
      VERCEL_PROJECT_ID: prj_6pa3hjvzCQEBtunN32Vpr8UE0GTk
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verifica token Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN non configurato nei GitHub Secrets."
            exit 2
          fi

      - name: Installa dipendenze
        run: npm install --ignore-scripts

      - name: Verifica Maviri
        run: npm run verify

      - name: Installa Vercel CLI
        run: npm install --global vercel@latest

      - name: Scarica configurazione Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Production su GitHub Actions
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt in Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
