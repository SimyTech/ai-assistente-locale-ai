name: Fix Mavi mobile UI contract

on:
  push:
    branches:
      - feat/mavi-screen-account-menu

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mavi-screen-account-menu
      - name: Restore quick prompts compatibility class
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="mavi-actions" aria-label="Azioni rapide di Mavi">'
          new='<div class="quick-prompts mavi-actions" aria-label="Azioni rapide di Mavi">'
          if old not in s:
              raise SystemExit('Mavi actions target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/fix-mavi-mobile-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Test: mantiene compatibilità prompt rapidi Mavi"
          git push origin HEAD:feat/mavi-screen-account-menu
