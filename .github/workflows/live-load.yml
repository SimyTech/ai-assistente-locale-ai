name: Misura carico reale Maviri

on:
  push:
    branches: ["codex/real-load-test"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-load:
    name: Carico reale isolato
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Misura Vercel e Redis senza dati reali
        run: node scripts/live-load.mjs
