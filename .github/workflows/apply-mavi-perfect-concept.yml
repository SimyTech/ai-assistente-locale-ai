name: Apply Mavi perfect concept
on:
  push:
    branches: [ui/mavi-perfect-concept]
    paths:
      - '.github/workflows/apply-mavi-perfect-concept.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mavi-perfect-concept
      - name: Apply approved visual
        run: python scripts/apply_mavi_approved_visual.py
      - name: Commit visual update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "UI: applica concept Mavi approvato"
          git push
