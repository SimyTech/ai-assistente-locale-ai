<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>AI Assistente Locale</title><style>
body{margin:0;background:#f5f6fa;color:#17181c;font-family:system-ui,sans-serif}header{background:#111827;color:white;padding:18px}h1{margin:0;font-size:21px}nav{display:flex;gap:6px;overflow:auto;background:white;padding:10px;position:sticky;top:0}nav button,button{padding:10px;border:0;border-radius:10px;font-weight:700}nav button{background:#eef2ff}main{max-width:800px;margin:auto;padding:16px}.page{display:none}.active{display:block}.card{background:white;padding:17px;border-radius:16px;margin-bottom:13px;border:1px solid #e5e7eb}input,textarea,select{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;box-sizing:border-box}.primary{background:#2563eb;color:white}.chat{height:330px;overflow:auto;background:#fafafa;border:1px solid #ddd;border-radius:12px;padding:10px}.msg{padding:10px 12px;border-radius:12px;margin:7px 0;max-width:86%;white-space:pre-wrap}.bot{background:#e5e7eb}.user{background:#dbeafe;margin-left:auto}.row{display:flex;gap:8px}.row input{margin:0}.muted{color:#667085;font-size:13px}</style></head><body>
<header><h1>AI Assistente Locale</h1><div class="muted" style="color:#cbd5e1">Assistente AI per attività locali</div></header>
<nav><button onclick="show('home')">Home</button><button onclick="show('ai')">AI</button><button onclick="show('app')">Appuntamenti</button><button onclick="show('post')">Post</button></nav>
<main>
<section id="home" class="page active"><div class="card"><h2>Dashboard</h2><p>Versione con assistente AI reale.</p><input id="biz" value="Salone Bella Linea"><button class="primary" onclick="save()">Salva attività</button></div></section>
<section id="ai" class="page"><div class="card"><h2>Assistente AI reale</h2><div id="chat" class="chat"><div class="msg bot">Ciao! Come posso aiutarti?</div></div><p id="status" class="muted"></p><div class="row"><input id="clientName" placeholder="Nome cliente"><input id="q" placeholder="Scrivi una domanda..."><button class="primary" onclick="send()">Invia</button></div></div></section>
<section id="app" class="page"><div class="card"><h2>Appuntamenti</h2><input id="n" placeholder="Nome cliente"><input id="d" type="date"><input id="t" type="time"><input id="s" placeholder="Servizio"><button class="primary" onclick="add()">Salva appuntamento</button><div id="list"></div></div></section>
<section id="post" class="page"><div class="card"><h2>Generatore post</h2><input id="topic" placeholder="Argomento"><button class="primary" onclick="post()">Genera post</button><textarea id="out" rows="9"></textarea></div></section>
</main>
<script>
const $=x=>document.getElementById(x);function show(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));$(x).classList.add('active')}
function save(){localStorage.biz=$('biz').value;alert('Salvato')}
let chatHistory = [];

async function send(){
  let x = $('q').value.trim();
  if(!x) return;

  let c = $('chat');

  c.innerHTML += `<div class="msg user">${esc(x)}</div>`;
  $('status').textContent='L’assistente sta pensando...';
  $('q').disabled=true;

  try {
    let r = await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        message:x,
        business:localStorage.biz||'Attività locale',
        history:chatHistory
      })
    });

    let j = await r.json();

    if(!r.ok) throw Error(j.error || 'Errore del server');

    chatHistory.push({
      role:'user',
      content:x
    });

    chatHistory.push({
      role:'assistant',
      content:j.reply
    });

    c.innerHTML += `<div class="msg bot">${esc(j.reply)}</div>`;

  } catch(e) {
    c.innerHTML += `<div class="msg bot">Si è verificato un problema: ${esc(e.message)}</div>`;
  }

  $('q').disabled=false;
  $('status').textContent='';
  $('q').value='';
  c.scrollTop=c.scrollHeight;
}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function add(){let a=JSON.parse(localStorage.a||'[]');a.push({n:$('n').value,d:$('d').value,t:$('t').value,s:$('s').value});localStorage.a=JSON.stringify(a);render()}
function render(){let a=JSON.parse(localStorage.a||'[]');$('list').innerHTML=a.map(x=>`<p><b>${esc(x.n)}</b> — ${esc(x.s)} — ${x.d} ${x.t}</p>`).join('')}
function post(){$('out').value=`✨ ${$('topic').value||'Nuova promozione'}!\n\nProfessionalità, attenzione e servizi personalizzati.\n\n📅 Prenota il tuo appuntamento.\n📩 Scrivici per informazioni.`}
$('biz').value=localStorage.biz||'Salone Bella Linea';render();
</script></body></html>
