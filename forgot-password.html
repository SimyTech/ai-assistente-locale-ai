<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07142f"><title>Maviri — Recupera password</title>
<style>:root{--n:#07142f;--t:#f6f8ff;--m:#9eafd0;--l:rgba(255,255,255,.1);--grad:linear-gradient(135deg,#38a7ff,#875cff 52%,#39d98a)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#07142f;color:var(--t)}body{display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#091a39;border:1px solid var(--l);border-radius:24px;padding:30px}.brand{font-size:28px;font-weight:900;margin-bottom:24px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}h1{margin:0 0 10px}.sub{color:var(--m);line-height:1.55;margin:0 0 22px}.field{display:grid;gap:7px}.field label{font-size:12px;color:var(--m)}input{width:100%;border:1px solid var(--l);border-radius:14px;background:#07142f;color:#fff;padding:14px 15px;font-size:15px;outline:none}button{width:100%;border:0;border-radius:14px;padding:14px 16px;margin-top:15px;color:#fff;background:var(--grad);font-weight:800;font-size:15px}.msg{min-height:24px;margin-top:14px;color:var(--m);font-size:13px;line-height:1.5}.error{color:#ff9aaa}.ok{color:#83edb7}.back{display:block;margin-top:18px;color:#9fcfff;text-decoration:none;font-size:13px;text-align:center}</style></head>
<body><main class="card"><div class="brand">Maviri</div><h1>Recupera password</h1><p class="sub">Inserisci l'email del tuo account. Se esiste, riceverai un link valido per 30 minuti.</p><form id="form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><button id="btn" type="submit">Invia link di recupero</button><div id="msg" class="msg" aria-live="polite"></div></form><a class="back" href="/login?switch=1">← Torna all'accesso</a></main>
<script>const $=id=>document.getElementById(id);function message(t,c=""){const el=$("msg");el.textContent=t;el.className="msg"+(c?" "+c:"")}$("form").addEventListener("submit",async e=>{e.preventDefault();const btn=$("btn");btn.disabled=true;message("Invio richiesta…");try{const r=await fetch("/api/password-reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim()})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Richiesta non riuscita.");message(j.message||"Controlla la tua email.","ok")}catch(err){message(err.message||"Richiesta non riuscita.","error")}finally{btn.disabled=false}});</script></body></html>
