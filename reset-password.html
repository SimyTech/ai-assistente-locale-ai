<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07142f"><title>Maviri — Nuova password</title><style>:root{--n:#07142f;--t:#f6f8ff;--m:#9eafd0;--l:rgba(255,255,255,.1);--grad:linear-gradient(135deg,#38a7ff,#875cff 52%,#39d98a)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#07142f;color:var(--t)}body{display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#091a39;border:1px solid var(--l);border-radius:24px;padding:30px}.brand{font-size:28px;font-weight:900;margin-bottom:24px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}h1{margin:0 0 10px}.sub{color:var(--m);line-height:1.55;margin:0 0 22px}.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-size:12px;color:var(--m)}input{width:100%;border:1px solid var(--l);border-radius:14px;background:#07142f;color:#fff;padding:14px 15px;font-size:15px;outline:none}button{width:100%;border:0;border-radius:14px;padding:14px 16px;margin-top:3px;color:#fff;background:var(--grad);font-weight:800;font-size:15px}.msg{min-height:24px;margin-top:14px;color:var(--m);font-size:13px;line-height:1.5}.error{color:#ff9aaa}.ok{color:#83edb7}.back{display:block;margin-top:18px;color:#9fcfff;text-decoration:none;font-size:13px;text-align:center}</style></head><body><main class="card"><div class="brand">Maviri</div><h1>Imposta una nuova password</h1><p class="sub">Scegli una password di almeno 10 caratteri.</p><form id="form"><div class="field"><label for="password">Nuova password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label for="confirm">Ripeti nuova password</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required></div><button id="btn" type="submit">Salva nuova password</button><div id="msg" class="msg" aria-live="polite"></div></form><a class="back" href="/login?switch=1">← Torna all'accesso</a></main><script>const $=id=>document.getElementById(id);const token=new URLSearchParams(location.search).get("token")||"";function message(t,c=""){const el=$("msg");el.textContent=t;el.className="msg"+(c?" "+c:"")}if(!token)message("Il link di recupero non è valido.","error");$("form").addEventListener("submit",async e=>{e.preventDefault();if(!token){message("Il link di recupero non è valido.","error");return}const p=$("password").value,c=$("confirm").value;if(p.length<10){message("La password deve contenere almeno 10 caratteri.","error");return}if(p!==c){message("Le due password non coincidono.","error");return}const btn=$("btn");btn.disabled=true;message("Aggiornamento password…");try{const r=await fetch("/api/password-reset",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,newPassword:p})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||"Aggiornamento non riuscito.");$("form").reset();message("Password aggiornata. Ora puoi accedere a Maviri.","ok");setTimeout(()=>location.replace("/login?switch=1"),1200)}catch(err){message(err.message||"Aggiornamento non riuscito.","error")}finally{btn.disabled=false}});</script></body></html>
