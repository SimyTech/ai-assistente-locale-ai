<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07142f">
<meta name="robots" content="noindex,nofollow">
<title>Mavi Chat — Assistente dell'attività</title>
<style>
:root{--bg:#07142f;--panel:#0d2349;--panel2:#091a39;--text:#f7f9ff;--muted:#aab9d7;--line:rgba(255,255,255,.09);--blue:#38a7ff;--violet:#875cff;--green:#39d98a;--grad:linear-gradient(135deg,var(--blue),var(--violet) 52%,var(--green))}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100dvh;background:radial-gradient(circle at 0 0,rgba(56,167,255,.14),transparent 36%),radial-gradient(circle at 100% 0,rgba(135,92,255,.14),transparent 36%),var(--bg)}
.shell{width:min(980px,100%);margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom))}.chat{width:100%;background:linear-gradient(180deg,rgba(5,20,47,.98),rgba(3,15,37,.99));border:1px solid rgba(56,167,255,.18);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}.head{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);background:rgba(6,22,50,.92)}.headcopy{min-width:0;flex:1}.name{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-top:2px}.head-actions{display:flex;align-items:center;gap:8px}.online{font-size:10px;font-weight:800;letter-spacing:.05em;padding:6px 9px;border-radius:99px;background:rgba(57,217,138,.12);color:#72e9ae}.new-chat{height:34px;padding:0 11px;font-size:11px}
.stage{position:relative;min-height:430px;padding:36px 18px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 26%,rgba(42,103,255,.2),transparent 30%),radial-gradient(circle at 78% 42%,rgba(34,221,174,.08),transparent 27%)}.logo-wrap{position:relative;z-index:2;width:152px;height:152px}.logo{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 0 16px rgba(56,167,255,.32))}.wave{position:absolute;z-index:1;top:112px;left:50%;width:140%;height:190px;transform:translateX(-50%);filter:drop-shadow(0 0 9px rgba(27,177,255,.34));pointer-events:none}.wave path{fill:none;stroke:url(#clientWave);stroke-linecap:round}.wave-main{stroke-width:3}.wave-soft{stroke-width:1.2;opacity:.42}.wave-faint{stroke-width:.8;opacity:.24}.tagline{position:relative;z-index:2;margin:12px 0 0;font-size:20px;font-weight:650;color:#edf3ff}.voice-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:11px;margin-top:26px}.voice{width:108px;height:108px;padding:0;border:3px solid rgba(65,226,255,.72)!important;border-radius:50%;font-size:41px!important;background:linear-gradient(145deg,#199eff 4%,#5048ff 50%,#d63bf1 100%)!important;box-shadow:0 0 0 8px rgba(44,118,255,.05),0 0 28px rgba(29,176,255,.45),0 0 48px rgba(155,61,255,.32)}.voice-label{font-size:15px;color:#b9c4df}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;padding:18px}.quick button{min-height:66px;height:auto;padding:11px 8px;border-radius:18px;border:1px solid rgba(56,167,255,.34);background:linear-gradient(180deg,rgba(9,31,69,.92),rgba(6,24,55,.94));font-size:14px;line-height:1.2}.conversation{margin:2px 18px 18px;border:1px solid rgba(56,167,255,.22);border-radius:24px;background:linear-gradient(180deg,rgba(4,18,43,.76),rgba(3,14,34,.86));overflow:hidden}.messages{min-height:190px;max-height:360px;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}.bubble{max-width:88%;padding:13px 16px;border-radius:18px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere}.mavi{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:6px}.user{align-self:flex-end;background:var(--grad);border-bottom-right-radius:6px}.composer{padding:12px;border-top:1px solid var(--line);background:rgba(6,19,43,.74)}.bar{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:9px;align-items:end}.bar textarea{width:100%;resize:none;max-height:120px;min-height:50px;border:1px solid rgba(56,167,255,.28);border-radius:25px;background:var(--panel2);color:#fff;padding:14px 18px;font:inherit;outline:none}.bar textarea:focus{border-color:rgba(56,167,255,.7)}button{border:1px solid var(--line);background:#173865;color:#fff;cursor:pointer;font-weight:750}.send{width:50px;height:50px;padding:0;border:0;border-radius:50%;background:var(--grad);font-size:0}.send::before{content:'➤';font-size:21px;display:block;transform:rotate(-18deg)}button:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}.foot{padding:0 14px 12px;color:var(--muted);font-size:10px;line-height:1.35;text-align:center}.error{color:#ffd1d1}
@media(max-width:600px){.shell{padding:6px}.chat{border-radius:21px}.head{padding:11px 12px}.head-actions{gap:5px}.online{padding:5px 7px}.new-chat{padding:0 8px}.stage{min-height:365px;padding:25px 10px 20px}.logo-wrap{width:126px;height:126px}.wave{top:88px;width:180%;height:160px}.tagline{margin-top:8px;font-size:17px}.voice-wrap{margin-top:22px}.voice{width:86px;height:86px;font-size:34px!important}.voice-label{font-size:13px}.quick{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:13px 10px}.quick button{min-height:60px;padding:8px 3px;border-radius:13px;font-size:10px}.conversation{margin:2px 10px 10px;border-radius:20px}.messages{min-height:170px;max-height:310px;padding:14px 12px}.bubble{max-width:96%;padding:12px 13px;font-size:13px}.composer{padding:9px}.bar{grid-template-columns:minmax(0,1fr) 50px;gap:7px}.bar textarea{min-height:48px;padding:13px 15px;font-size:14px}.send{width:48px;height:48px}.foot{padding-bottom:9px}}
@media(max-width:380px){.head .sub{display:none}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.quick button{font-size:12px}.logo-wrap{width:112px;height:112px}.stage{min-height:340px}.wave{top:80px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell">
<section class="chat" aria-label="Mavi Client Chat">
<header class="head"><div class="headcopy"><div class="name" id="businessName">Mavi</div><div class="sub">Mavi Client Chat · informazioni e prenotazioni</div></div><div class="head-actions"><button class="new-chat" id="newChat" type="button">Nuova chat</button><span class="online" id="connectionStatus" aria-live="polite">CONNESSIONE…</span></div></header>
<div class="stage">
  <div class="logo-wrap"><img class="logo" src="/assets/mavi-logo-official.png" alt="Mavi"></div>
  <svg class="wave" viewBox="0 0 1000 180" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="clientWave" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#875cff"/><stop offset="28%" stop-color="#38a7ff"/><stop offset="55%" stop-color="#37d7ff"/><stop offset="78%" stop-color="#39d98a"/><stop offset="100%" stop-color="#875cff"/></linearGradient></defs><path class="wave-faint" d="M0 92 C55 72 80 114 125 92 S195 48 240 92 S310 132 360 92 S430 54 480 92 S560 128 610 92 S680 58 730 92 S805 132 855 92 S930 66 1000 92"/><path class="wave-soft" d="M0 92 C45 105 65 55 105 92 S160 145 205 92 S260 38 310 92 S365 148 415 92 S475 42 525 92 S590 142 640 92 S700 46 750 92 S820 142 870 92 S940 50 1000 92"/><path class="wave-main" d="M0 92 C42 92 58 34 92 92 S142 154 188 92 S246 24 294 92 S354 162 402 92 S462 28 512 92 S575 154 624 92 S685 36 734 92 S798 150 846 92 S920 44 1000 92"/></svg>
  <p class="tagline">Il tuo assistente intelligente</p>
  <div class="voice-wrap"><button class="voice" id="voice" type="button" aria-label="Parla con Mavi">🎙</button><span class="voice-label">Tocca per parlare</span></div>
</div>
<div class="quick" aria-label="Domande rapide"><button type="button" data-message="Quali servizi e prezzi avete?">✦ Servizi e prezzi</button><button type="button" data-message="Avete promozioni attive?">◆ Promozioni</button><button type="button" data-message="Che disponibilità avete?">🗓 Disponibilità</button><button type="button" data-message="Vorrei prenotare un appuntamento">＋ Prenota</button><button type="button" data-message="Quali sono i vostri orari?">◷ Orari</button><button type="button" data-message="Dove vi trovate?">⌖ Dove siamo</button><button type="button" data-message="Come posso contattarvi?">☎ Contatti</button><button type="button" data-message="Vorrei prenotare per domani">▦ Per domani</button></div>
<div class="conversation"><div class="messages" id="messages" aria-live="polite"><div class="bubble mavi">Ciao, sono Mavi. Posso aiutarti con servizi, prezzi, orari, disponibilità e prenotazioni.</div></div>
<div class="composer"><div class="bar"><textarea id="input" rows="1" maxlength="1000" placeholder="Scrivi a Mavi…" autocomplete="off"></textarea><button class="send" id="send" type="button" aria-label="Invia messaggio">Invia</button></div></div></div>
<div class="foot">Per registrare una prenotazione Mavi richiede sempre una conferma esplicita.</div>
</section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const clean=v=>String(v??"").trim();
const parts=location.pathname.split("/").filter(Boolean);
const tenantFromPath=parts[0]==="mavi"&&parts[1]?decodeURIComponent(parts[1]):"";
const tenantFromQuery=clean(new URLSearchParams(location.search).get("tenant"));
const tenantFromSession=clean(localStorage.getItem("MAVIRI_TENANT_ID"));
const tenantId=clean((tenantFromPath&&tenantFromPath!=="default"?tenantFromPath:"")||tenantFromQuery||tenantFromSession||tenantFromPath);
const sessionId=(crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`);
const HISTORY_KEY=`mavi-client-history:${tenantId||"unknown"}`;
const history=[];
let busy=false;
function add(text,who,extra=""){const el=document.createElement("div");el.className=`bubble ${who} ${extra}`.trim();el.textContent=text;$("messages").appendChild(el);$("messages").scrollTop=$("messages").scrollHeight;return el}
function saveHistory(){try{sessionStorage.setItem(HISTORY_KEY,JSON.stringify({savedAt:Date.now(),history:history.slice(-20)}))}catch{}}
function restoreHistory(){try{const saved=JSON.parse(sessionStorage.getItem(HISTORY_KEY)||"null");if(!saved||Date.now()-Number(saved.savedAt||0)>30*60*1000)return sessionStorage.removeItem(HISTORY_KEY);if(!Array.isArray(saved.history))return;history.push(...saved.history.slice(-20));for(const item of history)add(item.content,item.role==="user"?"user":"mavi")}catch{sessionStorage.removeItem(HISTORY_KEY)}}
async function api(action,extra={}){const headers={"Content-Type":"application/json"};if(tenantId)headers["x-maviri-tenant"]=tenantId;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);let r;try{r=await fetch("/api/chat",{method:"POST",headers,signal:controller.signal,body:JSON.stringify({action,tenantId:tenantId||undefined,role:"client",mode:"client",channel:"web",source:"mavi-chat",sessionId,...extra})})}catch(error){if(error?.name==="AbortError")throw new Error("Mavi sta impiegando troppo tempo. Riprova tra poco.");throw new Error("Connessione non disponibile. Controlla la rete e riprova.")}finally{clearTimeout(timeout)}let data={};try{data=await r.json()}catch{}if(!r.ok||data?.ok===false)throw new Error(data?.error||"Mavi non è disponibile in questo momento.");return data}
function setBusy(value){busy=value;$("send").disabled=value;$("input").disabled=value;$("newChat").disabled=value;document.querySelectorAll(".quick button").forEach(button=>button.disabled=value);$("voice").disabled=value||!("SpeechRecognition" in window||"webkitSpeechRecognition" in window)}
async function init(){restoreHistory();try{const ctx=await api("public-context");const name=clean(ctx?.business?.name||ctx?.settings?.businessName||ctx?.name);if(name){$("businessName").textContent=name;document.title=`Mavi Client Chat — ${name}`}$("connectionStatus").textContent="ONLINE"}catch(err){$("connectionStatus").textContent="NON DISPONIBILE";add("Questa attività non è ancora disponibile su Mavi. Controlla il collegamento o contatta l'attività.","mavi","error");setBusy(true)}}
async function send(){if(busy)return;const input=$("input");const q=clean(input.value);if(!q)return;input.value="";add(q,"user");const wait=add("Sto verificando i dati…","mavi");setBusy(true);try{const r=await api("chat",{message:q,history:history.slice(-20)});const answer=clean(r?.answer||r?.reply||r?.message||r?.response||r?.text)||"Non ho ricevuto una risposta chiara. Puoi riformulare la richiesta?";wait.textContent=answer;history.push({role:"user",content:q},{role:"assistant",content:answer});if(history.length>20)history.splice(0,history.length-20);saveHistory()}catch(err){wait.textContent=clean(err?.message)||"Non riesco a rispondere in questo momento. Riprova tra poco.";wait.classList.add("error")}finally{setBusy(false);input.focus()}}
function quickMessage(message){if(busy)return;$("input").value=message;send()}
function resetChat(){if(busy)return;history.length=0;try{sessionStorage.removeItem(HISTORY_KEY)}catch{}$("messages").innerHTML="";add("Ciao, sono Mavi. Posso aiutarti con servizi, prezzi, orari, disponibilità e prenotazioni.","mavi");$("input").value="";$("input").focus()}
$("send").addEventListener("click",send);$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"});
$("newChat").addEventListener("click",resetChat);document.querySelectorAll(".quick button").forEach(button=>button.addEventListener("click",()=>quickMessage(button.dataset.message||button.textContent)));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){$("voice").addEventListener("click",()=>{if(busy)return;const r=new SR();r.lang="it-IT";r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{$("input").value=e.results[0][0].transcript;send()};r.onerror=()=>add("Microfono non disponibile.","mavi");r.start()})}else{$("voice").disabled=true}
init();
</script>
</body>
</html>
